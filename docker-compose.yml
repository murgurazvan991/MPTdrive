services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mptdrive-storage
    environment:
      - SAVE_DIR=/data
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data
      - .:/app:delegated
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mptdrive-api
    depends_on:
      - server
    environment:
      - TCP_SERVER_HOST=server
      - TCP_SERVER_PORT=8080
    ports:
      - "5000:5000"
    volumes:
      - .:/app:delegated
    command: ["python", "api_server.py"]
    restart: unless-stopped
  ui:
    build:
      context: .
      dockerfile: ui/my-app/Dockerfile
    container_name: mptdrive-ui
    depends_on:
      - api
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  uploads: